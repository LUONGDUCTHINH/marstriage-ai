[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "marstriage-ai"
version = "0.1.0"
description = "Foundation for Martian terrain segmentation and human review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/LUONGDUCTHINH/marstriage-ai"
Issues = "https://github.com/LUONGDUCTHINH/marstriage-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["marstriage_ai*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers -ra"
markers = [
    "integration: tests requiring explicitly configured external dependencies",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
